<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passcode</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; margin:0; background:#050608; color:#f8fafc; font-family:Inter,system-ui,sans-serif; }
  body{
    background:
      radial-gradient(circle at 15% 5%,rgba(79,70,229,.14),transparent 28%),
      radial-gradient(circle at 90% 15%,rgba(124,58,237,.10),transparent 25%),
      radial-gradient(circle at 50% 100%,rgba(37,99,235,.08),transparent 35%),
      #050608;
    min-height:100dvh; padding:18px; overflow-y:auto;
  }
  .wrap{ max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .glass{
    background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.065);
    backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
    border-radius:16px; padding:14px;
  }
  h1{ font-size:18px; font-weight:800; margin:0 0 2px; letter-spacing:-.3px; }
  .sub{ font-size:9px; color:#94a3b8; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  label{ display:block; font-size:10px; color:#94a3b8; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin:0 0 4px 2px; }
  input, select{
    width:100%; height:42px; border-radius:11px; padding:0 12px;
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.08);
    color:#f8fafc; outline:none; font-size:13px;
  }
  input:focus, select:focus{ border-color:rgba(99,102,241,.55); }
  .row{ display:grid; gap:8px; margin-bottom:10px; }
  .row.two{ grid-template-columns:1fr 1fr; }
  .row.three{ grid-template-columns:1fr 1fr 110px; }
  button{
    height:42px; border-radius:11px; font-size:11px; font-weight:800;
    letter-spacing:.04em; cursor:pointer; border:1px solid rgba(255,255,255,.08);
    color:#e2e8f0; background:rgba(255,255,255,.04);
  }
  button.primary{
    background: linear-gradient(135deg, rgba(89,103,232,.9), rgba(113,71,216,.9));
    border-color: rgba(167,139,250,.2); color:#fff;
  }
  button.small{ height:32px; font-size:9px; padding:0 10px; }
  button:active{ transform:scale(.985); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .err{ font-size:10px; color:#f87171; font-weight:700; margin-top:6px; }
  .hidden{ display:none !important; }
  .code-box{
    margin-top:10px; padding:10px; border-radius:12px;
    background:rgba(34,197,94,.06); border:1px solid rgba(34,197,94,.2);
  }
  .code-label{ font-size:8px; color:#4ade80; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
  .code-value{ font-family:ui-monospace,monospace; font-size:16px; font-weight:800; color:#86efac; letter-spacing:.08em; user-select:all; }
  .list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 11px; border-radius:11px;
    background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.05);
  }
  .item-info{ min-width:0; flex:1; }
.item-name{
  font-size:12px;
  font-weight:800;
  margin-bottom:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.item-name.expiring{
  color:#f59e0b;
}
  .item-meta{ font-size:9px; color:#94a3b8; }
  .badge{ font-size:8px; font-weight:800; text-transform:uppercase; padding:2px 6px; border-radius:5px; }
  .badge.active{ color:#4ade80; background:rgba(34,197,94,.1); }
  .badge.expired{ color:#facc15; background:rgba(250,204,21,.1); }
  .badge.revoked{ color:#f87171; background:rgba(239,68,68,.1); }
  .del{ width:28px; height:28px; border-radius:8px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.15); color:#f87171; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    padding:9px 14px; border-radius:11px; font-size:10px; font-weight:700;
    background:rgba(15,23,42,.95); border:1px solid rgba(34,197,94,.25); color:#86efac;
    z-index:9999; max-width:90vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .toast.err{ border-color:rgba(239,68,68,.3); color:#fca5a5; }
.footer{
  text-align:center;
  font-size:9px;
  color:#64748b;
  letter-spacing:.08em;
  text-transform:none;
  padding:12px 0;
}
.app-filters{
  display:grid;
  grid-template-columns:repeat(auto-fill, 88px);
  justify-content:start;
  align-items:start;
  gap:18px 14px;
  width:100%;
  box-sizing:border-box;
  margin-top:18px;
  margin-bottom:28px;
  padding:10px 6px 20px;
  overflow:visible;
  position:relative;
  isolation:isolate;
  clear:both;
}
.app-phone{
  width:88px;
  min-width:0;
  max-width:88px;
  min-height:0;
  height:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  box-sizing:border-box;
  background:transparent;
  border:none;
  padding:0;
  margin:0;
  position:relative;
  z-index:1;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.phone-frame{
  width:72px; height:72px; border-radius:18px; border:2.5px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative; box-shadow:0 4px 14px rgba(0,0,0,.4);
  flex-shrink:0;
}
.phone-fallback{
  display:none; width:100%; height:100%; align-items:center; justify-content:center;
  font-size:26px; font-weight:800; color:#94a3b8; background:rgba(255,255,255,.07);
}
.phone-frame-all{ background:rgba(99,102,241,.16); border-style:dashed; }
.phone-all-text{ font-size:14px; font-weight:800; color:#a5b4fc; letter-spacing:.03em; }
.phone-label{
  font-size:11px; font-weight:700; color:#94a3b8; text-align:center; line-height:1.2;
  max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.modal{
  position:fixed; inset:0; z-index:10000; display:flex; align-items:flex-end; justify-content:center;
  padding:12px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.modal-content{
  width:100%; max-width:420px; max-height:85dvh; overflow-y:auto;
  border-radius:18px 18px 14px 14px; padding:16px;
}
.modal-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.modal-title{ font-size:16px; font-weight:800; margin:0; letter-spacing:-.2px; }
.modal-row{
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:12px;
}
.modal-label{ color:#94a3b8; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.08em; flex-shrink:0; }
.modal-value{ font-weight:600; text-align:right; word-break:break-all; }
@media (max-width:480px){
  body{ padding:12px; }
  .row.two, .row.three{ grid-template-columns:1fr; }
  .row.three > div:last-child{ margin-top:2px; }
  .item{ padding:14px 12px; }
  .item-name{ font-size:14px; }
  .item-meta{ font-size:11px; }
  button{ height:46px; font-size:12px; }
  button.small{ height:38px; font-size:11px; }
  .modal{ align-items:flex-end; padding:0; }
  .modal-content{ border-radius:20px 20px 0 0; max-height:90dvh; }
  .phone-frame{ width:76px; height:76px; border-radius:20px; }
  .app-filters{
    grid-template-columns:repeat(auto-fill, 76px);
    gap:14px 10px;
    margin-bottom:28px;
    padding-bottom:20px;
  }
  .app-phone{
    width:76px;
    max-width:76px;
  }
  .phone-label{ font-size:12px; max-width:76px; }
  label{ font-size:11px; }
  .sub{ font-size:10px; }
  h1{ font-size:20px; }
}
</style>

<body>
<div class="wrap">

<div class="glass" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
  <div>
    <h1>Passcode</h1>
    <div class="sub">Console d'administration multi-PWA</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
    <button id="workerBtn" class="small" onclick="openWorkerModal()" title="Code du Worker" style="width:36px;padding:0;display:flex;align-items:center;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <button id="ghKeyBtn" class="small hidden" onclick="ghOpenKeyModal()" title="Token GitHub" style="width:36px;padding:0;display:flex;align-items:center;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="M18 5l2 2"/><path d="M15 8l2 2"/></svg>
    </button>
    <button id="disconnectBtn" class="small hidden" onclick="disconnect()" style="flex:0 0 auto;">
      Déconnexion
    </button>
  </div>
</div>

<div id="authCard" class="glass">
  <label>URL du Worker</label>
  <input id="workerUrl" type="url" placeholder="https://mon-worker.xxx.workers.dev" autocomplete="off" spellcheck="false">

  <label style="margin-top:10px;">Token administrateur</label>
<input id="adminToken" type="password" placeholder="ADMIN_TOKEN (gardé le temps de la session)" autocomplete="off" spellcheck="false">

  <div class="row two" style="margin-top:10px;">
    <button class="primary" onclick="connect()">Se connecter</button>
  </div>

  <div id="authErr" class="err hidden"></div>
</div>

  <div id="panel" class="glass hidden">
    <label>URL GitHub Pages de l'application cible</label>
<select id="appUrl" style="color-scheme:dark;" onchange="ghUpdateRemoveBtn()">
  <option value="">— enregistrez votre token GitHub —</option>
</select>
<div id="ghTokenBox" style="margin-top:10px;">
  <label>Token GitHub</label>
  <div style="display:flex;gap:8px;">
    <input id="ghTokenInput" type="password" placeholder="github_pat_… ou ghp_…" autocomplete="off" spellcheck="false" style="min-width:0;">
    <button class="small" style="height:42px;flex:0 0 auto;" onclick="ghSaveToken()">Enregistrer</button>
  </div>
</div>
<label style="margin-top:10px;">Code d'accès (vide = généré automatiquement)</label>
<input id="customCode" type="text" maxlength="64" placeholder="ex: jean2026" autocomplete="off" spellcheck="false">
    <div class="row three" style="margin-top:10px;">
      <div>
        <label>Utilisateur</label>
        <input id="userLabel" type="text" placeholder="ex: Jean" autocomplete="off">
      </div>
      <div>
        <label>Durée (jours, 0 = ∞)</label>
        <input id="days" type="number" min="0" max="3650" value="30">
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button class="primary" style="width:100%;" onclick="createCode()">Créer</button>
      </div>
    </div>

    <div id="newCodeBox" class="code-box hidden">
      <div class="code-label">Code créé — copiez-le maintenant</div>
      <div id="newCodeValue" class="code-value"></div>
<div class="row two" style="margin-top:8px; margin-bottom:0;">
  <button class="small" onclick="copyNewCode()">Copier le code</button>
  <button class="small" onclick="sendToAI()">Send IA</button>
</div>
<button class="small" style="width:100%;margin-top:8px;" onclick="shareNewCode()">Partager (WhatsApp, SMS…)</button>
    </div>
<div id="ghPanel" class="hidden" style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);">
  <button id="ghInstallBtn" class="primary" style="width:100%;" onclick="ghInstall()">Installer le module dans l'application choisie</button>
  <button id="ghChildBtn" style="width:100%;margin-top:8px;" onclick="openChildModal()">Enfanter (version payante protégée)</button>
  <button id="ghRemoveBtn" class="hidden" style="width:100%;margin-top:8px;color:#f87171;border-color:rgba(239,68,68,.25);" onclick="ghRemoveModule()">Retirer le module de protection</button>
  <button id="ghSyncBtn" class="primary hidden" style="width:100%;" onclick="ghSync()">Synchroniser l'application payante</button>

  <div id="ghProgress" class="hidden" style="margin-top:10px;">
    <div id="ghProgressText" class="item-meta" style="margin-bottom:6px;"></div>
    <div style="height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;">
      <div id="ghProgressBar" style="height:100%;width:0;background:linear-gradient(135deg,rgba(89,103,232,.9),rgba(113,71,216,.9));transition:width .5s linear;"></div>
    </div>

  <button id="ghOpenBtn" class="primary hidden" style="width:100%;margin-top:10px;" onclick="ghOpenApp()">Ouvrir l'application</button>
</div>
  </div>

  <div id="listPanel" class="glass hidden">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
      <div class="sub">Codes existants</div>
      <button class="small" onclick="loadCodes()">Rafraîchir</button>
    </div>
    <label>Filtrer par application (URL GitHub Pages)</label>
    <input id="filterApp" type="url" placeholder="laisser vide = tous" autocomplete="off" spellcheck="false">
<div id="appFilters" class="app-filters"></div>
<input id="searchCode" type="search" placeholder="Rechercher un utilisateur…" oninput="renderCodes()" autocomplete="off" spellcheck="false" style="margin-top:8px;">
    <div id="list" class="list"></div>
  </div>

<div id="consolePanel" class="glass" style="margin-top:12px;">

  <div onclick="const o=byId('consoleOutput');const a=byId('consoleArrow');if(o){const open=o.style.display==='none';o.style.display=open?'block':'none';if(a)a.textContent=open?'▲':'▼';if(open)o.scrollTop=o.scrollHeight;}" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;cursor:pointer;user-select:none;padding:4px 0;">
    <div class="sub" style="display:flex;align-items:center;gap:8px;">
      <span>Console</span>
      <span id="consoleArrow">▼</span>
    </div>

    <div style="display:flex;gap:6px;">
      <button class="small" onclick="event.stopPropagation();copyConsole()">Copier</button>
      <button class="small" onclick="event.stopPropagation();clearConsole()">Vider</button>
    </div>
  </div>

  <div id="consoleOutput" style="display:none;font-family:ui-monospace,monospace;font-size:10px;line-height:1.5;color:#cbd5e1;background:rgba(0,0,0,.35);border-radius:10px;padding:8px;max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;"></div>

</div>

  <div class="footer">PWC · Password Creator</div>
</div>
<div id="codeModal" class="modal hidden">
  <div class="modal-content glass">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Détails</h2>
      <button class="del" onclick="closeCodeModal()" title="Fermer">✕</button>
    </div>
    <div id="modalBody"></div>
    <div id="modalActions" style="margin-top:14px;display:flex;gap:8px;"></div>
  </div>
</div>

<script>
const LS_WORKER = 'pwc_worker_url';
const LS_APP = 'pwc_app_url';
let adminToken = '';
let lastCode = '';
let codesCache = [];
const LS_GH_TOKEN = 'pwc_gh_token';
const LS_GH_REPO = 'pwc_gh_repo';
const ghState = { busy: false, openUrl: '' };
const SS_ADMIN = 'pwc_admin_session';
let lastApp = '';

const byId = id => document.getElementById(id);
function confirmDialog(message, okLabel, danger) {
  return new Promise(function (resolve) {
    const old = byId('confirmModal');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'confirmModal';
    overlay.className = 'modal';
    overlay.style.zIndex = '10001';
    overlay.style.alignItems = 'center';
    overlay.style.padding = '16px';

    const box = document.createElement('div');
    box.className = 'modal-content glass';
    box.style.borderRadius = '18px';
    box.style.maxWidth = '380px';

    const text = document.createElement('div');
    text.style.cssText = 'font-size:13px;line-height:1.5;white-space:pre-line;margin-bottom:14px;';
    text.textContent = message;

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;';

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.style.flex = '1';
    cancelBtn.textContent = 'Annuler';

    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.style.flex = '1';
    okBtn.textContent = okLabel || 'Confirmer';
    if (danger) {
      okBtn.style.background = 'rgba(239,68,68,.15)';
      okBtn.style.borderColor = 'rgba(239,68,68,.35)';
      okBtn.style.color = '#fca5a5';
    } else {
      okBtn.className = 'primary';
    }

    function onKey(e) {
      if (e.key === 'Escape') finish(false);
    }

    function finish(result) {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(result);
    }

    cancelBtn.onclick = () => finish(false);
    okBtn.onclick = () => finish(true);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) finish(false);
    });
    document.addEventListener('keydown', onKey);

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(text);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    okBtn.focus();
  });
}

function toast(msg, isErr) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function log(msg, type) {
  type = type || 'info';

  const el = byId('consoleOutput');
  if (!el) return;

  const panel = byId('consolePanel');

  if (panel && type === 'err') {
    panel.classList.remove('hidden');
    el.style.display = 'block';

    const arrow = byId('consoleArrow');
    if (arrow) arrow.textContent = '▲';
  }

  const colors = {
    info: '#cbd5e1',
    ok: '#4ade80',
    warn: '#facc15',
    err: '#f87171'
  };

  const time = new Date().toLocaleTimeString('fr-FR');
  const line = document.createElement('div');

  line.style.color = colors[type] || colors.info;
  line.textContent = '[' + time + '] ' + msg;

  el.appendChild(line);

async function connect() {
  const err = byId('authErr');
  err.classList.add('hidden');

  const token = (byId('adminToken').value || '').trim();
  const base = workerUrl();

  log('Tentative de connexion…', 'info');
  log('URL Worker : ' + (base || '(vide)'), 'info');
  log('Token : ' + (token ? '(fourni, ' + token.length + ' caractères)' : '(vide)'), 'info');

  if (!base) {
    err.textContent = 'URL du Worker requise';
    err.classList.remove('hidden');
    log('Échec : URL Worker vide', 'err');
    return;
  }

  if (!token) {
    err.textContent = 'Token requis';
    err.classList.remove('hidden');
    log('Échec : token vide', 'err');
    return;
  }

  saveWorkerUrl();

  try {
    log('Appel GET ' + base + '/admin/codes', 'info');

    const t0 = Date.now();

    const resp = await fetch(base + '/admin/codes', {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    log(
      'Réponse HTTP ' + resp.status + ' en ' + (Date.now() - t0) + ' ms',
      resp.ok ? 'ok' : 'warn'
    );

    if (resp.status === 401 || resp.status === 403) {
      try { sessionStorage.removeItem(SS_ADMIN); } catch (x) {}
      byId('adminToken').value = '';
      err.textContent = 'Token invalide';
      err.classList.remove('hidden');
      log('Échec : token refusé par le Worker', 'err');
      return;
    }

    if (!resp.ok) {
      const text = await resp.text().catch(() => '');
      log('Corps de la réponse : ' + text.slice(0, 200), 'err');
      throw new Error('HTTP ' + resp.status);
    }

    const data = await resp.json();

    log('JSON reçu : ' + JSON.stringify(data).slice(0, 200), 'ok');

    adminToken = token;
    try { sessionStorage.setItem(SS_ADMIN, token); } catch (x) {}

    byId('adminToken').value = '';

    byId('authCard').classList.add('hidden');
    byId('disconnectBtn').classList.remove('hidden');

    byId('panel').classList.remove('hidden');
    byId('listPanel').classList.remove('hidden');

    log('Connecté avec succès', 'ok');

    toast('Connecté');

    await loadCodes();

  } catch (e) {
    log('Exception : ' + (e.message || e), 'err');

    err.textContent = 'Connexion impossible (' + (e.message || 'erreur') + ')';
    err.classList.remove('hidden');
  }
}

function disconnect() {
  adminToken = '';
  try { sessionStorage.removeItem(SS_ADMIN); } catch (x) {}

  byId('panel').classList.add('hidden');
  byId('listPanel').classList.add('hidden');
  byId('newCodeBox').classList.add('hidden');
  byId('authErr').classList.add('hidden');

  byId('authCard').classList.remove('hidden');
  byId('disconnectBtn').classList.add('hidden');

  byId('adminToken').value = '';

  closeCodeModal();

  log('Déconnecté', 'info');
  toast('Déconnecté');
}

async function createCode() {
  const err = byId('authErr');
  err.classList.add('hidden');
  if (!adminToken) { toast('Non authentifié', true); return; }
  const base = workerUrl();
  const app = (byId('appUrl').value || '').trim();
  const label = (byId('userLabel').value || '').trim();
  const customCode = (byId('customCode').value || '').trim();
  const days = parseInt(byId('days').value, 10);
  if (!app) { toast('URL GitHub Pages requise', true); return; }
  if (!label) { toast('Utilisateur requis', true); return; }
  if (customCode && !/^[A-Za-z0-9_.-]{4,64}$/.test(customCode)) {
    toast('Code : 4 à 64 caractères (lettres, chiffres, _ . -)', true);
    return;
  }
  saveAppUrl();
  const body = { label: label, app: app };
  if (customCode) body.code = customCode;
  if (!isNaN(days) && days > 0) body.expiresInDays = days;
  try {
    log('Création code : ' + JSON.stringify(body), 'info');
    const resp = await fetch(base + '/admin/codes', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    log('Réponse HTTP ' + resp.status, resp.ok ? 'ok' : 'warn');
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      throw new Error(d.error || ('HTTP ' + resp.status));
    }
    const data = await resp.json();
    lastCode = data.code;
    lastApp = app;
    byId('newCodeValue').textContent = data.code;
    byId('newCodeBox').classList.remove('hidden');
    byId('userLabel').value = '';
    byId('customCode').value = '';
    log('Code créé : ' + data.code, 'ok');
    try {
      await navigator.clipboard.writeText(data.code);
      toast('Code créé et copié');
    } catch (x) {
      toast('Code créé');
    }
    loadCodes();
  } catch (e) {
    log('Erreur création : ' + (e.message || e), 'err');
    toast('Création impossible : ' + (e.message || ''), true);
  }
}

function renderAppFilters(codes) {
  const el = byId('appFilters');
  if (!el) return;
  const apps = [...new Set((codes || []).map(c => c.app).filter(Boolean))].sort();
  const current = (byId('filterApp').value || '').trim();
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'app-phone' + (current === '' ? ' active' : '');
  allBtn.innerHTML =
    '<div class="phone-frame phone-frame-all"><span class="phone-all-text">Tous</span></div>' +
    '<div class="phone-label">Tous</div>';
  allBtn.onclick = () => {
    byId('filterApp').value = '';
    renderCodes();
  };
  el.appendChild(allBtn);

  apps.forEach(app => {
    let iconUrl = '';
    let short = app;
    try {
      const u = new URL(app);
      const path = u.pathname.replace(/\/+$/, '') || '';
      iconUrl = u.origin + path + '/icon.png';
      const parts = path.split('/').filter(Boolean);
      short = parts.length ? parts[parts.length - 1] : u.hostname.replace(/^www\./, '');
    } catch (e) {}

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'app-phone' + (current === app ? ' active' : '');
    chip.title = app;

    const frame = document.createElement('div');
    frame.className = 'phone-frame';

    const img = document.createElement('img');
    img.src = iconUrl;
    img.alt = short;
    img.loading = 'lazy';
    img.decoding = 'async';

    const fallback = document.createElement('div');
    fallback.className = 'phone-fallback';
    fallback.textContent = (short || '?').charAt(0).toUpperCase();
    fallback.style.display = 'none';

    img.onerror = () => {
      img.style.display = 'none';
      fallback.style.display = 'flex';
    };

    frame.appendChild(img);
    frame.appendChild(fallback);

    const label = document.createElement('div');
    label.className = 'phone-label';
    label.textContent = short.length > 12 ? short.slice(0, 11) + '…' : short;

    chip.appendChild(frame);
    chip.appendChild(label);
    chip.onclick = () => {
      byId('filterApp').value = app;
      selectApp(app);
      renderCodes();
    };
    el.appendChild(chip);
  });
}
function renderCodes() {
  const list = byId('list');
  if (!list) return;

  const filter = (byId('filterApp').value || '').trim();
  const q = ((byId('searchCode') || {}).value || '').trim().toLowerCase();
  let codes = codesCache || [];

  if (filter) {
    codes = codes.filter(c => (c.app || '').includes(filter));
  }

  if (q) {
    codes = codes.filter(c => (c.label || '').toLowerCase().includes(q));
  }

  list.innerHTML = '';

  if (codes.length === 0) {
    list.innerHTML = '<div class="item-meta" style="text-align:center;padding:8px;">Aucun code</div>';
    return;
  }

  codes.forEach(c => {
    const item = document.createElement('div');
    item.className = 'item';
    item.style.cursor = 'pointer';

    const expiresAt = c.expires_at ? new Date(c.expires_at).getTime() : null;
    const isExpiring =
      c.status === 'active' &&
      expiresAt &&
      expiresAt > Date.now() &&
      expiresAt - Date.now() < 30 * 24 * 60 * 60 * 1000;
    const canExtend = isExpiring || c.status === 'expired';

    const exp = expiresAt
      ? new Date(expiresAt).toLocaleDateString('fr-FR')
      : '∞';

    const maxD = (c.max_devices === undefined || c.max_devices === null) ? 1 : c.max_devices;
    const nD = c.devices || 0;
    const devLabel = nD + '/' + (maxD === 0 ? '∞' : maxD) + ' appareil' + (nD > 1 ? 's' : '');

    item.innerHTML =
      '<div class="item-info">' +
        '<div class="item-name' + (isExpiring ? ' expiring' : '') + '">' +
          escapeHtml(c.label || 'Sans nom') +
        '</div>' +
        '<div class="item-meta">Expiration : ' + exp + ' · ' + devLabel + '</div>' +
      '</div>' +
      '<span class="badge ' + escapeHtml(c.status || '') + '">' +
        escapeHtml(c.status || '—') +
      '</span>' +
      (canExtend ? '<button class="small ext" title="Prolonger de 30 jours" style="flex:0 0 auto;">+30 j</button>' : '') +
      '<button class="del" title="Révoquer le code">✕</button>';

    item.onclick = () => openCodeModal(c);

    const ext = item.querySelector('.ext');
    if (ext) {
      ext.onclick = (e) => {
        e.stopPropagation();
        extendCode(c, ext);
      };
    }

    const btn = item.querySelector('.del');
    if (btn) {
      btn.onclick = (e) => {
        e.stopPropagation();
        revokeCode(c.id);
      };
    }

    list.appendChild(item);
  });
}
async function loadCodes() {
  if (!adminToken) return;
  const base = workerUrl();
  const url = base + '/admin/codes';
  const list = byId('list');
  list.innerHTML = '<div class="item-meta" style="text-align:center;padding:8px;">Chargement...</div>';
  try {
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + adminToken } });
    log('GET ' + url + ' → ' + resp.status, resp.ok ? 'ok' : 'warn');
    if (resp.status === 401 || resp.status === 403) { disconnect(); return; }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const codes = (data && data.codes) || [];
    codesCache = codes;
    renderAppFilters(codes);
    renderCodes();
    ghLoadChildren();
  } catch (e) {
    list.innerHTML = '<div class="item-meta" style="text-align:center;padding:8px;color:#f87171;">Erreur de chargement</div>';
    log('Erreur chargement codes : ' + (e.message || e), 'err');
  }
}

async function revokeCode(id) {
  if (!id) return;
  if (!(await confirmDialog('Révoquer ce code ?', 'Révoquer', true))) return;

  const base = workerUrl().replace(/\/+$/, '');

  try {
    const resp = await fetch(
      base + '/admin/codes/' + encodeURIComponent(id) + '/revoke',
      {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + adminToken
        }
      }
    );

    const data = await resp.json().catch(() => ({}));

    log('Révocation → ' + resp.status, resp.ok ? 'ok' : 'warn');

    if (resp.status === 404 && data.error === 'Code introuvable ou déjà révoqué') {
      toast('Ce code est déjà révoqué ou inexistant', true);
      await loadCodes();
      return;
    }

    if (!resp.ok) {
      throw new Error(data.error || 'HTTP ' + resp.status);
    }

    toast('Code révoqué');
    await loadCodes();

  } catch (e) {
    log('Erreur révocation : ' + (e.message || e), 'err');
    toast('Révocation impossible : ' + (e.message || e), true);
  }
}
async function extendCode(c, btn) {
  if (!c || !c.id) return;

  const base = workerUrl().replace(/\/+$/, '');
  const exp = c.expires_at ? Number(c.expires_at) : 0;
  const remaining = exp > Date.now() ? Math.ceil((exp - Date.now()) / 86400000) : 0;
  const days = Math.min(3650, remaining + 30);

  if (btn) btn.disabled = true;

  try {
    const resp = await fetch(
      base + '/admin/codes/' + encodeURIComponent(c.id),
      {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify({ expiresInDays: days })
      }
    );

    const data = await resp.json().catch(() => ({}));
    log('Prolongation → ' + resp.status, resp.ok ? 'ok' : 'warn');

    if (!resp.ok) {
      throw new Error(data.error || ('HTTP ' + resp.status));
    }

    toast('Prolongé de 30 jours');
    await loadCodes();
  } catch (e) {
    log('Erreur prolongation : ' + (e.message || e), 'err');
    toast('Prolongation impossible : ' + (e.message || ''), true);
    if (btn) btn.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function selectApp(url) {
  const sel = byId('appUrl');
  if (!sel || sel.tagName !== 'SELECT') return;
  const norm = u => String(u || '').trim().toLowerCase().replace(/\/+$/, '');
  const opt = Array.from(sel.options).find(o => o.value && norm(o.value) === norm(url));
  if (opt) {
    sel.value = opt.value;
    ghUpdateRemoveBtn();
  }
}
function openCodeModal(c) {

    ? new Date(expiresAt).toLocaleString('fr-FR')
    : 'Jamais (∞)';

  let duration = 0;
  if (expiresAt) {
    duration = Math.max(1, Math.ceil((expiresAt - Date.now()) / 86400000));
  }

  const editable = c.status !== 'revoked';
  const maxD = (c.max_devices === undefined || c.max_devices === null) ? 1 : c.max_devices;

    '<div style="margin-top:12px;"><label for="editCodeApp">URL de l’application</label><input id="editCodeApp" type="url" value="' + escapeHtml(c.app || '') + '" ' + (editable ? '' : 'disabled') + ' style="width:100%;margin-top:5px;"></div>' +
    '<div style="margin-top:12px;"><label for="editCodeDuration">Durée en jours (0 = illimitée)</label><input id="editCodeDuration" type="number" min="0" max="3650" value="' + duration + '" ' + (editable ? '' : 'disabled') + ' style="width:100%;margin-top:5px;"></div>' +
    '<div style="margin-top:12px;"><label for="editCodeDevices">Appareils autorisés (0 = illimité)</label><input id="editCodeDevices" type="number" min="0" max="100" value="' + maxD + '" ' + (editable ? '' : 'disabled') + ' style="width:100%;margin-top:5px;"></div>' +
    '<div class="modal-row" style="margin-top:14px;"><span class="modal-label">Appareils liés</span><span class="modal-value">' + nD + ' / ' + (maxD === 0 ? '∞' : maxD) + '</span></div>' +
    (nD > 0
      ? '<button type="button" class="small" style="width:100%;margin-top:8px;" onclick="resetDevices(\'' + escapeHtml(c.id || '') + '\')">Délier les appareils</button>'
      : '') +
    '<div class="modal-row" style="margin-top:6px;"><span class="modal-label">Créé le</span><span class="modal-value">' + created + '</span></div>' +
    '<div class="modal-row"><span class="modal-label">Expire le</span><span class="modal-value">' + exp + '</span></div>' +
    '<div class="modal-row"><span class="modal-label">Statut</span><span class="modal-value"><span class="badge ' + escapeHtml(c.status || '') + '">' + escapeHtml(c.status || '—') + '</span></span></div>';

  const actions = byId('modalActions');
  actions.innerHTML = '';

  if (editable) {
    const saveBtn = document.createElement('button');
    saveBtn.className = 'primary';
    saveBtn.style.flex = '1';
    saveBtn.textContent = 'Enregistrer';
    saveBtn.onclick = () => saveCodeEdits(c.id);
    actions.appendChild(saveBtn);
  }

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'del';
  deleteBtn.style.flex = '1';
  deleteBtn.style.height = '46px';
  deleteBtn.textContent = 'Supprimer définitivement';
  deleteBtn.onclick = () => deleteCode(c.id);
  actions.appendChild(deleteBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'small';
  closeBtn.textContent = 'Fermer';
  closeBtn.onclick = closeCodeModal;
  actions.appendChild(closeBtn);

  byId('codeModal').classList.remove('hidden');
}
async function deleteCode(id) {
  if (!id) return;

  const confirmed = await confirmDialog(
    'Supprimer définitivement cet utilisateur et son code d’accès ? Cette action est irréversible.',
    'Supprimer',
    true
  );
  if (!confirmed) return;

  try {
    const base = workerUrl().replace(/\/+$/, '');

    const response = await fetch(
      base + '/admin/codes/' + encodeURIComponent(id),
      {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + adminToken
        }
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Erreur lors de la suppression');
    }

    closeCodeModal();
    toast('Utilisateur supprimé définitivement');
    await loadCodes();

  } catch (error) {
    toast(error.message || 'Impossible de supprimer cet utilisateur', true);
  }
}
async function saveCodeEdits(id) {
  const label = (byId('editCodeLabel').value || '').trim();
  const app = (byId('editCodeApp').value || '').trim();
  const expiresInDays = Number(byId('editCodeDuration').value);
  const maxDevices = Number(byId('editCodeDevices').value);

  if (!label) {
    toast('Le nom est obligatoire', true);
    return;
  }

  if (!app) {
    toast('L’URL de l’application est obligatoire', true);
    return;
  }

  if (!Number.isInteger(expiresInDays) || expiresInDays < 0 || expiresInDays > 3650) {
    toast('La durée doit être comprise entre 0 et 3650 jours', true);
    return;
  }

  if (!Number.isInteger(maxDevices) || maxDevices < 0 || maxDevices > 100) {
    toast('Appareils : entier entre 0 et 100', true);
    return;
  }

  const base = workerUrl().replace(/\/+$/, '');
  const btn = byId('modalActions').querySelector('.primary');

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Enregistrement…';
  }

  try {
    const response = await fetch(
      base + '/admin/codes/' + encodeURIComponent(id),
      {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify({
          label,
          app,
          expiresInDays,
          maxDevices
        })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Erreur lors de la modification');
    }

    toast('Modifications enregistrées');
    closeCodeModal();
    await loadCodes();

  } catch (error) {
    toast(error.message || 'Impossible d’enregistrer les modifications', true);

    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Enregistrer';
    }
  }

const WORKER_CODE = String.raw`const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
  'Access-Control-Allow-Headers': 'Content-Type, Authorization',
  'Access-Control-Max-Age': '86400'
};

const MAX_APP_BYTES = 10 * 1024 * 1024;

function json(data, status) {
  status = status || 200;
  return new Response(JSON.stringify(data), {
    status: status,
    headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-store', ...CORS }
  });
}

function noContent() {
  return new Response(null, { status: 204, headers: CORS });
}

async function sha256Bytes(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return new Uint8Array(buf);
}

async function sha256Hex(str) {
  const bytes = await sha256Bytes(str);
  let hex = '';
  for (let i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
  return hex;
}

async function timingSafeEqual(a, b) {
  const da = await sha256Bytes(a);
  const db = await sha256Bytes(b);
  if (da.length !== db.length) return false;
  let diff = 0;
  for (let i = 0; i < da.length; i++) diff |= da[i] ^ db[i];
  return diff === 0;
}

function generateCode(len) {
  len = len || 12;
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  let out = '';
  for (let i = 0; i < len; i++) out += alphabet[bytes[i] % alphabet.length];
  return out;
}

function normApp(u) {
  return String(u || '').trim().toLowerCase().replace(/\/+$/, '').replace(/\/index\.html$/, '').replace(/\/+$/, '');
}

function cleanAppId(s) {
  let id;
  try { id = decodeURIComponent(String(s || '')); } catch (e) { return null; }
  return /^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$/.test(id) ? id : null;
}

function watermark(html, label, codeId) {
  const safe = String(label || 'utilisateur').replace(/[<>&"'\-\r\n]/g, ' ').slice(0, 100);
  const tag = '<' + '!-- licence : ' + safe + ' / ' + String(codeId || '').slice(0, 8) + ' --' + '>';
  const m = /<body[^>]*>/i.exec(html);
  if (m) {
    const at = m.index + m[0].length;
    return html.slice(0, at) + '\n' + tag + html.slice(at);
  }
  return html + '\n' + tag;
}

const schemaReady = new WeakSet();
async function ensureSchema(env) {
  if (schemaReady.has(env)) return;
  await env.DB.batch([
    env.DB.prepare('CREATE TABLE IF NOT EXISTS access_codes (id TEXT PRIMARY KEY, code_hash TEXT NOT NULL UNIQUE, label TEXT, app TEXT, created_at INTEGER NOT NULL, expires_at INTEGER, revoked_at INTEGER)'),
    env.DB.prepare('CREATE INDEX IF NOT EXISTS idx_access_codes_hash ON access_codes (code_hash)'),
    env.DB.prepare('CREATE INDEX IF NOT EXISTS idx_access_codes_app ON access_codes (app)'),
    env.DB.prepare('CREATE TABLE IF NOT EXISTS code_devices (code_id TEXT NOT NULL, device_hash TEXT NOT NULL, first_seen INTEGER NOT NULL, last_seen INTEGER NOT NULL, PRIMARY KEY (code_id, device_hash))')
  ]);
  const info = await env.DB.prepare('PRAGMA table_info(access_codes)').all();
  const cols = (info.results || []).map(function (r) { return r.name; });
  if (cols.indexOf('max_devices') === -1) {
    try {
      await env.DB.prepare('ALTER TABLE access_codes ADD COLUMN max_devices INTEGER NOT NULL DEFAULT 1').run();
    } catch (e) {
      if (!/duplicate column/i.test(String(e && e.message ? e.message : e))) throw e;
    }
  }
  schemaReady.add(env);
}

async function checkRateLimit(env, ip, bucket) {
  if (!env.AUTH_RATE_LIMIT) return true;
  const minute = Math.floor(Date.now() / 60000);
  const key = 'rl:' + bucket + ':' + ip + ':' + minute;
  try {
    const cur = await env.AUTH_RATE_LIMIT.get(key);
    const n = cur ? parseInt(cur, 10) : 0;
    if (n >= 20) return false;
    await env.AUTH_RATE_LIMIT.put(key, String(n + 1), { expirationTtl: 120 });
    return true;
  } catch (e) {
    return true;
  }
}

async function checkAdmin(request, env) {
  if (!env.ADMIN_TOKEN) return { ok: false, response: json({ error: 'Administration non configurée' }, 503) };
  const auth = request.headers.get('Authorization') || '';
  if (auth.toLowerCase().indexOf('bearer ') !== 0) return { ok: false, response: json({ error: 'Authentification requise' }, 401) };
  const token = auth.slice(7).trim();
  if (!token) return { ok: false, response: json({ error: 'Token administrateur manquant' }, 401) };
  const ok = await timingSafeEqual(token, env.ADMIN_TOKEN);
  if (!ok) return { ok: false, response: json({ error: 'Token administrateur invalide' }, 403) };
  return { ok: true };
}

async function checkDevice(env, row, device) {
  const dh = await sha256Hex(device);
  const now = Date.now();
  const known = await env.DB.prepare('SELECT 1 AS ok FROM code_devices WHERE code_id = ? AND device_hash = ?').bind(row.id, dh).first();
  if (known) {
    await env.DB.prepare('UPDATE code_devices SET last_seen = ? WHERE code_id = ? AND device_hash = ?').bind(now, row.id, dh).run();
    return true;
  }
  const max = (row.max_devices === null || row.max_devices === undefined) ? 1 : row.max_devices;
  if (max > 0) {
    const cnt = await env.DB.prepare('SELECT COUNT(*) AS n FROM code_devices WHERE code_id = ?').bind(row.id).first();
    if (cnt && cnt.n >= max) return false;
  }
  await env.DB.prepare('INSERT OR IGNORE INTO code_devices (code_id, device_hash, first_seen, last_seen) VALUES (?, ?, ?, ?)').bind(row.id, dh, now, now).run();
  return true;
}

async function handleVerify(request, env) {
  let body;
  try {
    const text = await request.text();
    if (text.length > 2048) return json({ error: 'Payload trop volumineux' }, 413);
    body = JSON.parse(text);
  } catch (e) {
    return json({ error: 'JSON invalide' }, 400);
  }
  const raw = body && (body.code || body.password);
  if (!raw || typeof raw !== 'string' || raw.length === 0 || raw.length > 256) {
    return json({ error: 'Code manquant ou invalide' }, 400);
  }
  const ip = request.headers.get('CF-Connecting-IP') || 'unknown';
  const allowed = await checkRateLimit(env, ip, 'verify');
  if (!allowed) return json({ error: 'Trop de tentatives' }, 429);
  if (env.GATE_PASSWORD) {
    const legacyOk = await timingSafeEqual(raw, env.GATE_PASSWORD);
    if (legacyOk) return json({ valid: true });
  }
  if (!env.DB) return json({ error: 'Base de données indisponible' }, 503);
  await ensureSchema(env);
  const hash = await sha256Hex(raw);
  const row = await env.DB.prepare('SELECT id, expires_at, revoked_at, max_devices FROM access_codes WHERE code_hash = ?').bind(hash).first();
  if (!row) return json({ valid: false });
  if (row.revoked_at) return json({ valid: false });
  if (row.expires_at && row.expires_at <= Date.now()) return json({ valid: false });

  const device = (body && typeof body.device === 'string') ? body.device.trim() : '';
  if (device) {
    if (device.length < 8 || device.length > 128) return json({ error: 'Identifiant appareil invalide' }, 400);
    const okDevice = await checkDevice(env, row, device);
    if (!okDevice) return json({ valid: false, reason: 'device_limit' });
  }
  return json({ valid: true });
}

async function handleAppLoad(request, env, id) {
  if (!env.APP_STORE) return json({ error: 'Stockage des applications indisponible (binding APP_STORE absent)' }, 503);
  if (!env.DB) return json({ error: 'Base de données indisponible' }, 503);
  let body;
  try {
    const text = await request.text();
    if (text.length > 2048) return json({ error: 'Payload trop volumineux' }, 413);
    body = JSON.parse(text);
  } catch (e) {
    return json({ error: 'JSON invalide' }, 400);
  }
  const raw = body && body.code;
  if (!raw || typeof raw !== 'string' || raw.length > 256) {
    return json({ error: 'Code manquant ou invalide' }, 400);
  }
  const device = (body && typeof body.device === 'string') ? body.device.trim() : '';
  if (device.length < 8 || device.length > 128) {
    return json({ error: 'Identifiant appareil requis' }, 400);
  }
  const ip = request.headers.get('CF-Connecting-IP') || 'unknown';
  const allowed = await checkRateLimit(env, ip, 'app');
  if (!allowed) return json({ error: 'Trop de tentatives' }, 429);

  const meta = await env.APP_STORE.getWithMetadata('meta:' + id);
  if (!meta || meta.value === null || !meta.metadata) {
    return json({ valid: false, reason: 'unknown_app' }, 404);
  }

  await ensureSchema(env);
  const hash = await sha256Hex(raw);
  const row = await env.DB.prepare('SELECT id, label, app, expires_at, revoked_at, max_devices FROM access_codes WHERE code_hash = ?').bind(hash).first();
  if (!row || row.revoked_at || (row.expires_at && row.expires_at <= Date.now())) {
    return json({ valid: false, reason: 'invalid' });
  }
  if (!row.app || normApp(row.app) !== normApp(meta.metadata.app)) {
    return json({ valid: false, reason: 'wrong_app' });
  }

  const okDevice = await checkDevice(env, row, device);
  if (!okDevice) return json({ valid: false, reason: 'device_limit' });

  const html = await env.APP_STORE.get('app:' + id);
  if (html === null) return json({ valid: false, reason: 'unavailable' }, 404);

  return json({ valid: true, html: watermark(html, row.label, row.id) });
}

async function handlePutApp(request, env, id) {
  const ip = request.headers.get('CF-Connecting-IP') || 'unknown';
  const allowed = await checkRateLimit(env, ip, 'admin');
  if (!allowed) return json({ error: 'Trop de tentatives' }, 429);
  const auth = await checkAdmin(request, env);
  if (!auth.ok) return auth.response;
  if (!env.APP_STORE) return json({ error: 'Binding KV "APP_STORE" absent' }, 503);
  let body;
  try {
    const text = await request.text();
    if (text.length > MAX_APP_BYTES + 4096) return json({ error: 'Application trop volumineuse (10 Mo maximum)' }, 413);
    body = JSON.parse(text);
  } catch (e) {
    return json({ error: 'JSON invalide' }, 400);
  }
  const html = body && body.html;
  const app = body && body.app;
  const source = (body && typeof body.source === 'string') ? body.source.trim().slice(0, 200) : '';
  if (typeof html !== 'string' || !html.trim()) return json({ error: 'html manquant' }, 400);
  if (typeof app !== 'string' || !/^https:\/\//i.test(app.trim()) || app.length > 200) return json({ error: 'app invalide (URL https attendue)' }, 400);
  const size = new TextEncoder().encode(html).length;
  if (size > MAX_APP_BYTES) return json({ error: 'Application trop volumineuse (10 Mo maximum)' }, 413);
  const now = Date.now();
  try {
    await env.APP_STORE.put('app:' + id, html);
    await env.APP_STORE.put('meta:' + id, '1', { metadata: { app: app.trim(), source: source, updated_at: now, size: size } });
  } catch (e) {
    return json({ error: 'Écriture KV impossible : ' + (e && e.message ? e.message : String(e)) }, 500);
  }
  return json({ stored: true, id: id, app: app.trim(), source: source, updated_at: now, size: size });
}

async function handleListApps(request, env) {
  const auth = await checkAdmin(request, env);
  if (!auth.ok) return auth.response;
  if (!env.APP_STORE) return json({ error: 'Binding KV "APP_STORE" absent' }, 503);
  try {
    const apps = [];
    let cursor;
    for (let i = 0; i < 10; i++) {
      const res = await env.APP_STORE.list({ prefix: 'meta:', cursor: cursor });
      (res.keys || []).forEach(function (k) {
        const m = k.metadata || {};
        apps.push({ id: k.name.slice(5), app: m.app || null, source: m.source || null, updated_at: m.updated_at || null, size: m.size || 0 });
      });
      if (res.list_complete) break;
      cursor = res.cursor;
    }
    return json({ apps: apps });
  } catch (e) {
    return json({ error: 'KV: ' + (e && e.message ? e.message : String(e)) }, 500);
  }
}

async function handleDeleteApp(request, env, id) {

async function handleCreateCode(request, env) {
  const ip = request.headers.get('CF-Connecting-IP') || 'unknown';
  const allowed = await checkRateLimit(env, ip, 'admin');
  if (!allowed) return json({ error: 'Trop de tentatives' }, 429);
  const auth = await checkAdmin(request, env);
  if (!auth.ok) return auth.response;
  let body;
  try {
    const text = await request.text();
    if (text.length > 4096) return json({ error: 'Payload trop volumineux' }, 413);
    body = text ? JSON.parse(text) : {};
  } catch (e) {
    return json({ error: 'JSON invalide' }, 400);
  }
  const label = (body && typeof body.label === 'string') ? body.label.slice(0, 100) : null;
  const app = (body && typeof body.app === 'string') ? body.app.slice(0, 200) : null;
  let expiresInDays = null;
  if (body && body.expiresInDays !== undefined && body.expiresInDays !== null) {
    const v = Number(body.expiresInDays);
    if (!isFinite(v) || v < 0 || v > 3650) return json({ error: 'expiresInDays invalide' }, 400);
    expiresInDays = v;
  }
  let maxDevices = 1;
  if (body && body.maxDevices !== undefined && body.maxDevices !== null) {
    const m = Number(body.maxDevices);
    if (!Number.isInteger(m) || m < 0 || m > 100) return json({ error: 'maxDevices invalide' }, 400);
    maxDevices = m;
  }
  if (!env.DB) return json({ error: 'Base de données indisponible' }, 503);
  await ensureSchema(env);
  let code;
  if (body && typeof body.code === 'string' && body.code.trim().length > 0) {
    const custom = body.code.trim();
    if (custom.length < 4 || custom.length > 64) return json({ error: 'Le code doit faire entre 4 et 64 caractères' }, 400);
    if (!/^[A-Za-z0-9_.-]+$/.test(custom)) return json({ error: 'Caractères autorisés : lettres, chiffres, _ . -' }, 400);
    code = custom;
  } else {
    code = generateCode(12);
  }
  const hash = await sha256Hex(code);
  const existing = await env.DB.prepare('SELECT id FROM access_codes WHERE code_hash = ?').bind(hash).first();
  if (existing) return json({ error: 'Ce code existe déjà' }, 409);
  const id = crypto.randomUUID();
  const now = Date.now();
  const expiresAt = (expiresInDays !== null && expiresInDays > 0) ? now + expiresInDays * 86400000 : null;
  try {
    await env.DB.prepare('INSERT INTO access_codes (id, code_hash, label, app, created_at, expires_at, revoked_at, max_devices) VALUES (?, ?, ?, ?, ?, ?, NULL, ?)').bind(id, hash, label, app, now, expiresAt, maxDevices).run();
  } catch (e) {
    return json({ error: 'Création impossible' }, 500);
  }
  return json({ id: id, code: code, label: label, app: app, expires_at: expiresAt, created_at: now, max_devices: maxDevices }, 201);
}

async function handleListCodes(request, env, url) {
  const auth = await checkAdmin(request, env);
  if (!auth.ok) return auth.response;
  if (!env.DB) return json({ error: 'Binding D1 "DB" absent' }, 503);
  try {
    await ensureSchema(env);
    const appFilter = url.searchParams.get('app');
    const cols = 'c.id, c.label, c.app, c.created_at, c.expires_at, c.revoked_at, c.max_devices, (SELECT COUNT(*) FROM code_devices d WHERE d.code_id = c.id) AS devices';
    let result;
    if (appFilter) {
      result = await env.DB.prepare('SELECT ' + cols + ' FROM access_codes c WHERE c.app = ? ORDER BY c.created_at DESC LIMIT 200').bind(appFilter).all();
    } else {
      result = await env.DB.prepare('SELECT ' + cols + ' FROM access_codes c ORDER BY c.created_at DESC LIMIT 200').all();
    }
    const now = Date.now();
    const rows = (result.results || []).map(function (r) {
      let status = 'active';
      if (r.revoked_at) status = 'revoked';
      else if (r.expires_at && r.expires_at <= now) status = 'expired';
      return { id: r.id, label: r.label, app: r.app, created_at: r.created_at, expires_at: r.expires_at, revoked_at: r.revoked_at, max_devices: r.max_devices, devices: r.devices, status: status };
    });
    return json({ codes: rows });
  } catch (e) {
    return json({ error: 'DB: ' + (e && e.message ? e.message : String(e)) }, 500);
  }
}

async function handleRevokeCode(request, env, id) {

async function handleUpdateCode(request, env, id) {
  const ip = request.headers.get('CF-Connecting-IP') || 'unknown';
  const allowed = await checkRateLimit(env, ip, 'admin');
  if (!allowed) return json({ error: 'Trop de tentatives' }, 429);
  const auth = await checkAdmin(request, env);
  if (!auth.ok) return auth.response;
  let body;
  try {
    const text = await request.text();
    if (text.length > 4096) return json({ error: 'Payload trop volumineux' }, 413);
    body = text ? JSON.parse(text) : {};
  } catch (e) {
    return json({ error: 'JSON invalide' }, 400);
  }
  if (!env.DB) return json({ error: 'Base de données indisponible' }, 503);
  await ensureSchema(env);
  const sets = [];
  const vals = [];
  if (body && body.label !== undefined) {
    if (typeof body.label !== 'string' || !body.label.trim()) return json({ error: 'Nom invalide' }, 400);
    sets.push('label = ?');
    vals.push(body.label.trim().slice(0, 100));
  }
  if (body && body.app !== undefined) {
    if (typeof body.app !== 'string' || !body.app.trim()) return json({ error: 'URL invalide' }, 400);
    sets.push('app = ?');
    vals.push(body.app.trim().slice(0, 200));
  }
  if (body && body.expiresInDays !== undefined) {
    const v = Number(body.expiresInDays);
    if (!isFinite(v) || v < 0 || v > 3650) return json({ error: 'expiresInDays invalide' }, 400);
    sets.push('expires_at = ?');
    vals.push(v > 0 ? Date.now() + v * 86400000 : null);
  }
  if (body && body.maxDevices !== undefined) {
    const m = Number(body.maxDevices);
    if (!Number.isInteger(m) || m < 0 || m > 100) return json({ error: 'maxDevices invalide' }, 400);
    sets.push('max_devices = ?');
    vals.push(m);
  }
  if (!sets.length) return json({ error: 'Rien à modifier' }, 400);
  vals.push(id);
  const res = await env.DB.prepare('UPDATE access_codes SET ' + sets.join(', ') + ' WHERE id = ? AND revoked_at IS NULL').bind(...vals).run();
  if (!res.meta || res.meta.changes === 0) return json({ error: 'Code introuvable ou révoqué' }, 404);
  return json({ updated: true, id: id });
}

async function handleResetDevices(request, env, id) {
  const ip = request.headers.get('CF-Connecting-IP') || 'unknown';

        else if (j.reason === 'wrong_app') err.textContent = 'Ce code ne donne pas accès à cette application';
        else if (j.reason === 'unknown_app' || j.reason === 'unavailable') err.textContent = 'Application indisponible';
        else if (!res.ok && j.error) err.textContent = j.error;
        else err.textContent = 'Code invalide';
        input.focus();
      })
      .catch(function (ex) {
        err.textContent = (ex instanceof TypeError)
          ? 'Connexion impossible. Un accès réseau est nécessaire.'
          : (ex.message || 'Erreur');
      })
      .then(function () {
        if (btn.isConnected) setBusy(false);
      });
  });

  input.focus();
}
function ghBuildLoader(base, id, title, manifest, hasManifest, iconName) {
  const c = ghChildColors(manifest);
  const lt = '<';
  const safe = s => JSON.stringify(s).replace(/</g, '\\u003c');

  const css =
    '*{box-sizing:border-box}html,body{margin:0;height:100%}' +
    'body{display:flex;align-items:center;justify-content:center;padding:20px;background:' + c.bg + ';color:' + c.fg + ';font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}' +
    '.card{width:100%;max-width:360px;padding:26px 22px;border-radius:18px;text-align:center;background:' + c.card + ';border:1px solid ' + c.line + '}' +
    '.ic{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:' + c.accSoft + ';color:' + c.acc + '}' +
    '.t{font-size:18px;font-weight:800;margin:0 0 4px}' +
    '.s{font-size:12px;margin:0 0 18px;opacity:.6}' +
    'input{display:block;width:100%;height:46px;padding:0 14px;margin:0 0 10px;border-radius:12px;border:1px solid ' + c.line + ';background:' + c.field + ';color:inherit;font-size:16px;outline:none;text-align:center;letter-spacing:.08em}' +
    'input:focus{border-color:' + c.acc + '}' +
    'button{display:block;width:100%;height:46px;border:0;border-radius:12px;background:' + c.acc + ';color:' + c.accFg + ';font-size:14px;font-weight:800;cursor:pointer}' +
    'button:disabled{opacity:.55;cursor:wait}' +
    '.e{min-height:18px;margin-top:10px;font-size:12px;font-weight:700;color:#f87171}';

  const head =
    '<meta charset="UTF-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n' +
    '<title>' + escapeHtml(title) + '</title>\n' +
    '<meta name="theme-color" content="' + c.bgHex + '">\n' +
    '<meta name="apple-mobile-web-app-capable" content="yes">\n' +
    '<meta name="apple-mobile-web-app-title" content="' + escapeHtml(title) + '">\n' +
    (hasManifest ? '<link rel="manifest" href="./manifest.json">\n' : '') +
    (iconName ? '<link rel="icon" href="./' + iconName + '">\n<link rel="apple-touch-icon" href="./' + iconName + '">\n' : '') +
    lt + 'script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__pwcInstallEvt=e;try{window.dispatchEvent(new Event("pwc-install"))}catch(x){}});' + lt + '/script>\n' +
    lt + '!--PWC-CHILD id=' + id + '-->\n';

  const lock = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  const body =
    '<form id="f" class="card" autocomplete="off" novalidate>' +
      '<div class="ic">' + lock + '</div>' +
      '<div class="t">' + escapeHtml(title) + '</div>' +
      '<div class="s">Saisissez votre code d\'accès</div>' +
      '<input id="c" type="password" placeholder="Code d\'accès" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<button id="b" type="submit">Déverrouiller</button>' +
      '<div id="e" class="e" role="alert"></div>' +
    '</form>';

  return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n' + head +
    lt + 'style>' + css + lt + '/style>\n</head>\n<body>\n' + body + '\n' +
    lt + 'script>(' + pwcChildLoader.toString() + ')(' + safe(base) + ',' + safe(id) + ');' + lt + '/script>\n' +
    '</body>\n</html>\n';
}
async function ghCollectAssets(full, info) {
  const listPath = info.apiPath.replace(/\/?index\.html$/, '');
  const items = await ghApi(listPath + '?ref=' + encodeURIComponent(info.branch));
  const files = (Array.isArray(items) ? items : []).filter(it => it.type === 'file' && it.size <= 2000000);

  const getB64 = async it => {
    const blob = await ghApi('/repos/' + full + '/git/blobs/' + it.sha);
    return String(blob.content || '').replace(/\s/g, '');
  };

  const manifestItem = files.find(it => it.name.toLowerCase() === 'manifest.json');
  const wanted = new Set();
  let manifest = null;
  let manifestB64 = '';

  if (manifestItem) {
    manifestB64 = await getB64(manifestItem);
    try {
      manifest = JSON.parse(ghB64ToText(manifestB64));
      (manifest.icons || []).forEach(i => {
        if (i && typeof i.src === 'string') wanted.add(i.src.split('?')[0].split('/').pop());
      });
    } catch (e) {
      manifest = null;
    }
  }

  const pattern = /^(icon[\w.-]*\.(png|ico|svg|webp)|favicon[\w.-]*|apple-touch-icon[\w.-]*\.png|splash[\w.-]*\.png)$/i;
  const out = [];

  for (const it of files) {
    if (it === manifestItem) continue;
    if (it.name.toLowerCase() === 'index.html') continue;
    if (!(pattern.test(it.name) || wanted.has(it.name))) continue;
    out.push({ name: it.name, b64: await getB64(it) });
  }

  if (manifestItem) {
    if (manifest) {
      manifest.start_url = './';
      manifest.scope = './';
      manifest.id = './';
      (manifest.icons || []).forEach(i => {
        if (i && typeof i.src === 'string') i.src = './' + i.src.split('?')[0].split('/').pop();
      });
      out.push({ name: 'manifest.json', b64: ghTextToB64(JSON.stringify(manifest, null, 2)) });
    } else {
      out.push({ name: 'manifest.json', b64: manifestB64 });
    }
  }

  const iconFile = out.find(f => /icon/i.test(f.name) && /\.png$/i.test(f.name));

  return {
    files: out,
    manifest: manifest,
    hasManifest: !!manifestItem,
    icon: iconFile ? iconFile.name : ''
  };
}
async function ghPutNew(full, path, b64, branch, message) {
  const apiPath = '/repos/' + full + '/contents/' + path.split('/').map(encodeURIComponent).join('/');
  let last;
  for (let i = 0; i < 5; i++) {
    try {
      return await ghApi(apiPath, {
        method: 'PUT',
        body: { message: message, content: b64, branch: branch }
      });
    } catch (e) {
      last = e;
      if (e.status !== 404 && e.status !== 409) throw e;
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  throw last;
}
async function ghWorkerPutApp(id, html, appUrl, source) {
  const base = workerUrl().replace(/\/+$/, '');
  const resp = await fetch(base + '/admin/apps/' + encodeURIComponent(id), {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + adminToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ html: html, app: appUrl, source: source })
  });
  const data = await resp.json().catch(() => ({}));
  log('Worker app ' + id + ' → ' + resp.status, resp.ok ? 'ok' : 'warn');
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}
async function ghLoadChildren() {
  if (!adminToken) return;
  const base = workerUrl().replace(/\/+$/, '');
  if (!base) return;

  try {
    const resp = await fetch(base + '/admin/apps', {
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    if (!resp.ok) {
      log('Applications payantes : HTTP ' + resp.status + ' (binding APP_STORE ou Worker non à jour ?)', 'warn');
      return;
    }
    const data = await resp.json();
    ghState.children = (data && data.apps) || [];
    log(ghState.children.length + ' application(s) payante(s)', 'ok');
  } catch (e) {
    log('Applications payantes : ' + (e.message || e), 'warn');
    return;
  }

  const sel = byId('appUrl');
  if (sel) {
    Array.from(sel.options).filter(o => o.dataset.repo).forEach(ghLabelOption);
    ghUpdateRemoveBtn();
  }
}
function openChildModal() {
  const sel = byId('appUrl');
  const opt = sel.options[sel.selectedIndex];
  const full = opt && opt.dataset.repo;
  if (!full) { toast('Choisissez une application', true); return; }
  if (!adminToken) { toast('Non authentifié', true); return; }

  const suggested = (opt.dataset.name || 'app').replace(/[^A-Za-z0-9_-]/g, '-').slice(0, 56) + '-pro';

  byId('modalTitle').textContent = 'Enfanter ' + (opt.dataset.name || '');

  byId('modalBody').innerHTML =
    '<div class="item-meta" style="font-size:11px;line-height:1.5;margin-bottom:12px;">' +
      'Crée un repo public qui ne contient qu\'un écran de saisie. Le code de l\'application est stocké dans le Worker et livré uniquement avec un code valide. ' +
      'L\'original reste inchangé : tant qu\'il est public, son code reste lisible.' +
    '</div>' +
    '<label for="childName">Nom du repo enfant</label>' +
    '<input id="childName" type="text" maxlength="63" value="' + escapeHtml(suggested) + '" autocomplete="off" spellcheck="false" style="width:100%;margin-top:5px;">' +
    '<div class="item-meta" style="font-size:10px;margin-top:6px;">Lettres, chiffres, - et _ uniquement. Ce nom sert aussi d\'identifiant dans le Worker.</div>';

  goBtn.style.flex = '1';
  goBtn.textContent = 'Créer l\'enfant';

  actions.appendChild(goBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'small';
  closeBtn.textContent = 'Fermer';
  closeBtn.onclick = closeCodeModal;
  actions.appendChild(closeBtn);

  byId('codeModal').classList.remove('hidden');
  const input = byId('childName');
  if (input) input.focus();
}
async function ghEnfanter() {
  if (ghState.busy) return;

  const name = (byId('childName').value || '').trim();
  if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$/.test(name)) {
    toast('Nom : lettres, chiffres, - et _ (63 max)', true);
    return;
  }

  const sel = byId('appUrl');
  const opt = sel.options[sel.selectedIndex];
  const full = opt && opt.dataset.repo;
  if (!full) { toast('Choisissez une application', true); return; }
  if (!adminToken) { toast('Non authentifié', true); return; }

  const base = workerUrl().replace(/\/+$/, '');
  if (!base) { toast('URL du Worker manquante', true); return; }

  closeCodeModal();

  const openBtn = byId('ghOpenBtn');
  ghSetBusy(true);
  ghState.openUrl = '';
  openBtn.classList.add('hidden');

  let uploaded = false;
  let created = false;

  try {
    ghSetProgress(0, 'Lecture de l\'original…');
    log('Enfanter : lecture de ' + full, 'info');

    const info = await ghReadIndex(full, opt.dataset.branch || 'main');
    const html = ghStripModule(info.text);

    const tm = /<title[^>]*>([^<]*)<\/title>/i.exec(info.text);
    const title = (tm && tm[1].trim()) || opt.dataset.name || name;

    const me = await ghApi('/user');
    const owner = me.login;
    const childFull = owner + '/' + name;
    const childUrl = 'https://' + owner.toLowerCase() + '.github.io/' + name + '/';

    let exists = true;
    try {
      await ghApi('/repos/' + childFull);
    } catch (e) {
      if (e.status === 404) exists = false;
      else throw e;
    }
    if (exists) throw new Error('Un repo nommé ' + name + ' existe déjà');

    ghSetProgress(0, 'Envoi de l\'application au Worker…');
    await ghWorkerPutApp(name, html, childUrl, full);
    uploaded = true;

    ghSetProgress(0, 'Copie du manifest et des icônes…');
    const assets = await ghCollectAssets(full, info);

    ghSetProgress(0, 'Création du repo ' + name + '…');
    const repo = await ghApi('/user/repos', {
      method: 'POST',
      body: {
        name: name,
        description: 'Version protégée par Passcode',
        private: false,
        auto_init: true
      }
    });
    created = true;
    const branch = repo.default_branch || 'main';
    log('Repo créé : ' + repo.full_name, 'ok');

    ghSetProgress(0, 'Envoi de l\'écran de saisie…');
    const loader = ghBuildLoader(base, name, title, assets.manifest, assets.hasManifest, assets.icon);
    const sw =
      "self.addEventListener('install', function () { self.skipWaiting(); });\n" +
      "self.addEventListener('activate', function (e) { e.waitUntil(self.clients.claim()); });\n" +
      "self.addEventListener('fetch', function () {});\n";

    await ghPutNew(repo.full_name, 'index.html', ghTextToB64(loader), branch, 'Écran de saisie (Passcode)');
    await ghPutNew(repo.full_name, 'sw.js', ghTextToB64(sw), branch, 'Service worker minimal (Passcode)');
    for (const f of assets.files) {
      await ghPutNew(repo.full_name, f.name, f.b64, branch, 'Ajout de ' + f.name);
    }

    ghSetProgress(0, 'Activation de GitHub Pages…');
    try {
      await ghApi('/repos/' + repo.full_name + '/pages', {
        method: 'POST',
        body: { source: { branch: branch, path: '/' } }
      });
    } catch (e) {
      if (e.status !== 409) throw e;
    }

    const ready = await ghWaitForPages(childUrl, name, 'PWC-CHILD id=' + name);

    if (ready) {
      ghSetProgress(100, 'Application payante publiée');
      log('Enfant publié : ' + childUrl, 'ok');
      toast('Application payante créée');
      openBtn.textContent = 'Ouvrir l\'application';
    } else {
      ghSetProgress(95, 'Publication non confirmée après 5 min (peut être encore en cours)', true);
      log('Enfant : publication non confirmée après 5 min', 'warn');
      toast('Publication non confirmée', true);
      openBtn.textContent = 'Ouvrir quand même';
    }

    ghState.openUrl = childUrl;
    openBtn.classList.remove('hidden');

    await ghLoadChildren();
    await ghLoadRepos();
    selectApp(childUrl);

  } catch (e) {
    if (uploaded && !created) {
      try {
        await fetch(base + '/admin/apps/' + encodeURIComponent(name), {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });
      } catch (x) {}
    }
    const hint = created ? ' (le repo ' + name + ' a été créé : supprimez-le sur GitHub avant de réessayer)' : '';
    ghSetProgress(0, 'Échec : ' + (e.message || e) + hint, true);
    log('Erreur enfantement : ' + (e.message || e), 'err');
    toast('Enfantement impossible : ' + (e.message || ''), true);
  } finally {
    ghSetBusy(false);
  }
}
async function ghSync() {
  if (ghState.busy) return;

  const sel = byId('appUrl');
  const opt = sel.options[sel.selectedIndex];
  if (!opt || opt.dataset.child !== '1') { toast('Choisissez une application payante', true); return; }

  const source = opt.dataset.source;
  const id = opt.dataset.appId;
  if (!source || !id) { toast('Original inconnu pour cette application', true); return; }
  if (!adminToken) { toast('Non authentifié', true); return; }

  const confirmed = await confirmDialog(
    'Mettre à jour ' + id + ' depuis ' + source + ' ?\nLa nouvelle version est servie aux utilisateurs dès leur prochaine ouverture.',
    'Synchroniser'
  );
  if (!confirmed) return;

  const openBtn = byId('ghOpenBtn');
  ghSetBusy(true);
  openBtn.classList.add('hidden');

  try {
    ghSetProgress(10, 'Lecture de l\'original…');
    log('Synchronisation : lecture de ' + source, 'info');

    const info = await ghReadIndex(source, 'main');
    const html = ghStripModule(info.text);

    ghSetProgress(60, 'Envoi au Worker…');
    await ghWorkerPutApp(id, html, opt.value, source);

    ghSetProgress(100, 'Application synchronisée');
    log('Synchronisation terminée : ' + id, 'ok');
    toast('Application synchronisée');

    ghState.openUrl = opt.value;
    openBtn.textContent = 'Ouvrir l\'application';
    openBtn.classList.remove('hidden');
  } catch (e) {
    ghSetProgress(0, 'Échec : ' + (e.message || e), true);
    log('Erreur synchronisation : ' + (e.message || e), 'err');
    toast('Synchronisation impossible : ' + (e.message || ''), true);
  } finally {
    ghSetBusy(false);
  }
}

window.addEventListener('error', (e) => {
  log(
    'Erreur JS : ' +
    (e.message || 'inconnue') +
    ' @ ' +
    (e.filename || '?') +
    ':' +
    (e.lineno || '?'),

window.addEventListener('unhandledrejection', (e) => {

    (e.reason && e.reason.message ? e.reason.message : String(e.reason)),

(function init() {
  log('PWC démarré', 'ok');
  const savedWorker = localStorage.getItem(LS_WORKER);
  if (savedWorker) { byId('workerUrl').value = savedWorker; log('URL Worker restaurée : ' + savedWorker, 'info'); }
  const savedApp = localStorage.getItem(LS_APP);
  if (savedApp) { byId('appUrl').value = savedApp; log('URL app restaurée : ' + savedApp, 'info'); }
  log('Prêt. Saisissez le token admin puis cliquez sur Se connecter.', 'info');
  const modal = byId('codeModal');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeCodeModal();
    });
  }
  let savedSession = '';
  try { savedSession = sessionStorage.getItem(SS_ADMIN) || ''; } catch (x) {}
  if (savedSession && savedWorker) {
    byId('adminToken').value = savedSession;
    connect();
  }
})();
(function ghInit() {
  ghRefreshTokenStatus();
  if (ghToken()) ghLoadRepos();
})();
(function keysInit() {
  const bind = (id, fn) => {
    const el = byId(id);
    if (!el) return;
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        fn();
      }
    });
  };
  bind('workerUrl', connect);
  bind('adminToken', connect);
  bind('userLabel', createCode);
  bind('customCode', createCode);
  bind('days', createCode);
})();
