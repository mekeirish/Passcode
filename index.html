<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passcode</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; margin:0; background:#050608; color:#f8fafc; font-family:Inter,system-ui,sans-serif; }
  body{
    background:
      radial-gradient(circle at 15% 5%,rgba(79,70,229,.14),transparent 28%),
      radial-gradient(circle at 90% 15%,rgba(124,58,237,.10),transparent 25%),
      radial-gradient(circle at 50% 100%,rgba(37,99,235,.08),transparent 35%),
      #050608;
    min-height:100dvh; padding:18px; overflow-y:auto;
  }
  .wrap{ max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .glass{
    background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.065);
    backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
    border-radius:16px; padding:14px;
  }
  h1{ font-size:18px; font-weight:800; margin:0 0 2px; letter-spacing:-.3px; }
  .sub{ font-size:9px; color:#94a3b8; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  label{ display:block; font-size:10px; color:#94a3b8; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin:0 0 4px 2px; }
  input, select{
    width:100%; height:42px; border-radius:11px; padding:0 12px;
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.08);
    color:#f8fafc; outline:none; font-size:13px;
  }
  input:focus, select:focus{ border-color:rgba(99,102,241,.55); }
  .row{ display:grid; gap:8px; margin-bottom:10px; }
  .row.two{ grid-template-columns:1fr 1fr; }
  .row.three{ grid-template-columns:1fr 1fr 110px; }
  button{
    height:42px; border-radius:11px; font-size:11px; font-weight:800;
    letter-spacing:.04em; cursor:pointer; border:1px solid rgba(255,255,255,.08);
    color:#e2e8f0; background:rgba(255,255,255,.04);
  }
  button.primary{
    background: linear-gradient(135deg, rgba(89,103,232,.9), rgba(113,71,216,.9));
    border-color: rgba(167,139,250,.2); color:#fff;
  }
  button.small{ height:32px; font-size:9px; padding:0 10px; }
  button:active{ transform:scale(.985); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .err{ font-size:10px; color:#f87171; font-weight:700; margin-top:6px; }
  .hidden{ display:none !important; }
  .code-box{
    margin-top:10px; padding:10px; border-radius:12px;
    background:rgba(34,197,94,.06); border:1px solid rgba(34,197,94,.2);
  }
  .code-label{ font-size:8px; color:#4ade80; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
  .code-value{ font-family:ui-monospace,monospace; font-size:16px; font-weight:800; color:#86efac; letter-spacing:.08em; user-select:all; }
  .list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 11px; border-radius:11px;
    background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.05);
  }
  .item-info{ min-width:0; flex:1; }
.item-name{
  font-size:12px;
  font-weight:800;
  margin-bottom:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.item-name.expiring{
  color:#f59e0b;
}
  .item-meta{ font-size:9px; color:#94a3b8; }
  .badge{ font-size:8px; font-weight:800; text-transform:uppercase; padding:2px 6px; border-radius:5px; }
  .badge.active{ color:#4ade80; background:rgba(34,197,94,.1); }
  .badge.expired{ color:#facc15; background:rgba(250,204,21,.1); }
  .badge.revoked{ color:#f87171; background:rgba(239,68,68,.1); }
  .del{ width:28px; height:28px; border-radius:8px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.15); color:#f87171; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    padding:9px 14px; border-radius:11px; font-size:10px; font-weight:700;
    background:rgba(15,23,42,.95); border:1px solid rgba(34,197,94,.25); color:#86efac;
    z-index:9999; max-width:90vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .toast.err{ border-color:rgba(239,68,68,.3); color:#fca5a5; }
.footer{
  text-align:center;
  font-size:9px;
  color:#64748b;
  letter-spacing:.08em;
  text-transform:none;
  padding:12px 0;
}
.app-filters{
  display:grid;
  grid-template-columns:repeat(auto-fill, 88px);
  justify-content:start;
  align-items:start;
  gap:18px 14px;
  width:100%;
  box-sizing:border-box;
  margin-top:18px;
  margin-bottom:28px;
  padding:10px 6px 20px;
  overflow:visible;
  position:relative;
  isolation:isolate;
  clear:both;
}
.app-phone{
  width:88px;
  min-width:0;
  max-width:88px;
  min-height:0;
  height:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  box-sizing:border-box;
  background:transparent;
  border:none;
  padding:0;
  margin:0;
  position:relative;
  z-index:1;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.phone-frame{
  width:72px; height:72px; border-radius:18px; border:2.5px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative; box-shadow:0 4px 14px rgba(0,0,0,.4);
  flex-shrink:0;
}
.phone-fallback{
  display:none; width:100%; height:100%; align-items:center; justify-content:center;
  font-size:26px; font-weight:800; color:#94a3b8; background:rgba(255,255,255,.07);
}
.phone-frame-all{ background:rgba(99,102,241,.16); border-style:dashed; }
.phone-all-text{ font-size:14px; font-weight:800; color:#a5b4fc; letter-spacing:.03em; }
.phone-label{
  font-size:11px; font-weight:700; color:#94a3b8; text-align:center; line-height:1.2;
  max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.modal{
  position:fixed; inset:0; z-index:10000; display:flex; align-items:flex-end; justify-content:center;
  padding:12px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.modal-content{
  width:100%; max-width:420px; max-height:85dvh; overflow-y:auto;
  border-radius:18px 18px 14px 14px; padding:16px;
}
.modal-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.modal-title{ font-size:16px; font-weight:800; margin:0; letter-spacing:-.2px; }
.modal-row{
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:12px;
}
.modal-label{ color:#94a3b8; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.08em; flex-shrink:0; }
.modal-value{ font-weight:600; text-align:right; word-break:break-all; }
@media (max-width:480px){
  body{ padding:12px; }
  .row.two, .row.three{ grid-template-columns:1fr; }
  .row.three > div:last-child{ margin-top:2px; }
  .item{ padding:14px 12px; }
  .item-name{ font-size:14px; }
  .item-meta{ font-size:11px; }
  button{ height:46px; font-size:12px; }
  button.small{ height:38px; font-size:11px; }
  .modal{ align-items:flex-end; padding:0; }
  .modal-content{ border-radius:20px 20px 0 0; max-height:90dvh; }
  .phone-frame{ width:76px; height:76px; border-radius:20px; }
  .app-filters{
    grid-template-columns:repeat(auto-fill, 76px);
    gap:14px 10px;
    margin-bottom:28px;
    padding-bottom:20px;
  }
  .app-phone{
    width:76px;
    max-width:76px;
  }
  .phone-label{ font-size:12px; max-width:76px; }
  label{ font-size:11px; }
  .sub{ font-size:10px; }
  h1{ font-size:20px; }
}
</style>

<body>
<div class="wrap">

<div class="glass" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
  <div>
    <h1>PWC — Password Creator</h1>
    <div class="sub">Console d'administration multi-PWA</div>
  </div>
  <button id="disconnectBtn" class="small hidden" onclick="disconnect()" style="flex:0 0 auto;">
    Déconnexion
  </button>
</div>

<div id="authCard" class="glass">
  <label>URL du Worker</label>
  <input id="workerUrl" type="url" placeholder="https://mon-worker.xxx.workers.dev" autocomplete="off" spellcheck="false">

  <label style="margin-top:10px;">Token administrateur</label>
  <input id="adminToken" type="password" placeholder="ADMIN_TOKEN (jamais stocké)" autocomplete="off" spellcheck="false">

  <div class="row two" style="margin-top:10px;">
    <button class="primary" onclick="connect()">Se connecter</button>
  </div>

  <div id="authErr" class="err hidden"></div>
</div>

  <div id="panel" class="glass hidden">
    <label>URL GitHub Pages de l'application cible</label>
    <input id="appUrl" type="url" placeholder="https://user.github.io/mon-app/" autocomplete="off" spellcheck="false">
    <div class="row three" style="margin-top:10px;">
      <div>
        <label>Utilisateur</label>
        <input id="userLabel" type="text" placeholder="ex: Jean" autocomplete="off">
      </div>
      <div>
        <label>Durée (jours, 0 = ∞)</label>
        <input id="days" type="number" min="0" max="3650" value="30">
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button class="primary" style="width:100%;" onclick="createCode()">Créer</button>
      </div>
    </div>

    <div id="newCodeBox" class="code-box hidden">
      <div class="code-label">Code créé — copiez-le maintenant</div>
      <div id="newCodeValue" class="code-value"></div>
      <div class="row two" style="margin-top:8px; margin-bottom:0;">
        <button class="small" onclick="copyNewCode()">Copier le code</button>
        <button class="small" onclick="sendToAI()">Send IA</button>
      </div>
    </div>
  </div>

  <div id="listPanel" class="glass hidden">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
      <div class="sub">Codes existants</div>
      <button class="small" onclick="loadCodes()">Rafraîchir</button>
    </div>
    <label>Filtrer par application (URL GitHub Pages)</label>
    <input id="filterApp" type="url" placeholder="laisser vide = tous" autocomplete="off" spellcheck="false">
<div id="appFilters" class="app-filters"></div>
    <div id="list" class="list"></div>
  </div>

<div id="consolePanel" class="glass" style="margin-top:12px;">

  <div onclick="const o=byId('consoleOutput');const a=byId('consoleArrow');if(o){const open=o.style.display==='none';o.style.display=open?'block':'none';if(a)a.textContent=open?'▲':'▼';if(open)o.scrollTop=o.scrollHeight;}" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;cursor:pointer;user-select:none;padding:4px 0;">
    <div class="sub" style="display:flex;align-items:center;gap:8px;">
      <span>Console</span>
      <span id="consoleArrow">▼</span>
    </div>

    <div style="display:flex;gap:6px;">
      <button class="small" onclick="event.stopPropagation();copyConsole()">Copier</button>
      <button class="small" onclick="event.stopPropagation();clearConsole()">Vider</button>
    </div>
  </div>

  <div id="consoleOutput" style="display:none;font-family:ui-monospace,monospace;font-size:10px;line-height:1.5;color:#cbd5e1;background:rgba(0,0,0,.35);border-radius:10px;padding:8px;max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;"></div>

</div>

  <div class="footer">PWC · Password Creator</div>
</div>
<div id="codeModal" class="modal hidden">
  <div class="modal-content glass">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Détails</h2>
      <button class="del" onclick="closeCodeModal()" title="Fermer">✕</button>
    </div>
    <div id="modalBody"></div>
    <div id="modalActions" style="margin-top:14px;display:flex;gap:8px;"></div>
  </div>
</div>

<script>
const LS_WORKER = 'pwc_worker_url';
const LS_APP = 'pwc_app_url';
let adminToken = '';
let lastCode = '';
let codesCache = [];

const byId = id => document.getElementById(id);

function toast(msg, isErr) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function log(msg, type) {
  type = type || 'info';

  const el = byId('consoleOutput');
  if (!el) return;

  const panel = byId('consolePanel');

  if (panel && type === 'err') {
    panel.classList.remove('hidden');
    el.style.display = 'block';

    const arrow = byId('consoleArrow');
    if (arrow) arrow.textContent = '▲';
  }

  const colors = {
    info: '#cbd5e1',
    ok: '#4ade80',
    warn: '#facc15',
    err: '#f87171'
  };

  const time = new Date().toLocaleTimeString('fr-FR');
  const line = document.createElement('div');

  line.style.color = colors[type] || colors.info;
  line.textContent = '[' + time + '] ' + msg;

  el.appendChild(line);
  el.scrollTop = el.scrollHeight;

  try {
    console.log('[PWC]', msg);
  } catch (e) {}
}

function clearConsole() {
  const el = byId('consoleOutput');
  if (el) el.innerHTML = '';
}

async function copyConsole() {
  const el = byId('consoleOutput');
  if (!el) return;
  try {
    await navigator.clipboard.writeText(el.innerText || '');
    toast('Rapport copié');
  } catch (e) {
    toast('Copie impossible', true);
  }
}

function workerUrl() {
  return (byId('workerUrl').value || '').trim().replace(/\/+$/, '');
}

function saveWorkerUrl() {
  const u = workerUrl();
  if (u) localStorage.setItem(LS_WORKER, u);
}

function saveAppUrl() {
  const u = (byId('appUrl').value || '').trim();
  if (u) localStorage.setItem(LS_APP, u);
}

async function connect() {
  const err = byId('authErr');
  err.classList.add('hidden');

  const token = (byId('adminToken').value || '').trim();
  const base = workerUrl();

  log('Tentative de connexion…', 'info');
  log('URL Worker : ' + (base || '(vide)'), 'info');
  log('Token : ' + (token ? '(fourni, ' + token.length + ' caractères)' : '(vide)'), 'info');

  if (!base) {
    err.textContent = 'URL du Worker requise';
    err.classList.remove('hidden');
    log('Échec : URL Worker vide', 'err');
    return;
  }

  if (!token) {
    err.textContent = 'Token requis';
    err.classList.remove('hidden');
    log('Échec : token vide', 'err');
    return;
  }

  saveWorkerUrl();

  try {
    log('Appel GET ' + base + '/admin/codes', 'info');

    const t0 = Date.now();

    const resp = await fetch(base + '/admin/codes', {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    log(
      'Réponse HTTP ' + resp.status + ' en ' + (Date.now() - t0) + ' ms',
      resp.ok ? 'ok' : 'warn'
    );

    if (resp.status === 401 || resp.status === 403) {
      err.textContent = 'Token invalide';
      err.classList.remove('hidden');
      log('Échec : token refusé par le Worker', 'err');
      return;
    }

    if (!resp.ok) {
      const text = await resp.text().catch(() => '');
      log('Corps de la réponse : ' + text.slice(0, 200), 'err');
      throw new Error('HTTP ' + resp.status);
    }

    const data = await resp.json();

    log('JSON reçu : ' + JSON.stringify(data).slice(0, 200), 'ok');

    adminToken = token;

    byId('adminToken').value = '';

    byId('authCard').classList.add('hidden');
    byId('disconnectBtn').classList.remove('hidden');

    byId('panel').classList.remove('hidden');
    byId('listPanel').classList.remove('hidden');

    log('Connecté avec succès', 'ok');

    toast('Connecté');

    await loadCodes();

  } catch (e) {
    log('Exception : ' + (e.message || e), 'err');

    err.textContent = 'Connexion impossible (' + (e.message || 'erreur') + ')';
    err.classList.remove('hidden');
  }
}

function disconnect() {
  adminToken = '';

  byId('panel').classList.add('hidden');
  byId('listPanel').classList.add('hidden');
  byId('newCodeBox').classList.add('hidden');
  byId('authErr').classList.add('hidden');

  byId('authCard').classList.remove('hidden');
  byId('disconnectBtn').classList.add('hidden');

  byId('adminToken').value = '';

  closeCodeModal();

  log('Déconnecté', 'info');
  toast('Déconnecté');
}

async function createCode() {
  const err = byId('authErr');
  err.classList.add('hidden');
  if (!adminToken) { toast('Non authentifié', true); return; }
  const base = workerUrl();
  const app = (byId('appUrl').value || '').trim();
  const label = (byId('userLabel').value || '').trim();
  const days = parseInt(byId('days').value, 10);
  if (!app) { toast('URL GitHub Pages requise', true); return; }
  if (!label) { toast('Utilisateur requis', true); return; }
  saveAppUrl();
  const body = { label: label, app: app };
  if (!isNaN(days) && days > 0) body.expiresInDays = days;
  try {
    log('Création code : ' + JSON.stringify(body), 'info');
    const resp = await fetch(base + '/admin/codes', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    log('Réponse HTTP ' + resp.status, resp.ok ? 'ok' : 'warn');
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      throw new Error(d.error || ('HTTP ' + resp.status));
    }
    const data = await resp.json();
    lastCode = data.code;
    byId('newCodeValue').textContent = data.code;
    byId('newCodeBox').classList.remove('hidden');
    byId('userLabel').value = '';
    log('Code créé : ' + data.code, 'ok');
    toast('Code créé');
    loadCodes();
  } catch (e) {
    log('Erreur création : ' + (e.message || e), 'err');
    toast('Création impossible : ' + (e.message || ''), true);
  }
}

async function copyNewCode() {
  try {
    await navigator.clipboard.writeText(lastCode);
    toast('Code copié');
  } catch (e) {
    toast('Copie impossible', true);
  }
}

async function sendToAI() {
  const base = workerUrl();
  const app = (byId('appUrl').value || '').trim();
  const code = lastCode;
  if (!base || !app || !code) { toast('Code ou URL manquante', true); return; }
  const prompt = [
    'Tu es un développeur web expert. Voici une PWA (code source ci-dessous).',
    '',
    'Objectif : ajouter une protection par code d\'accès AVANT le lancement de l\'application.',
    '',
    'Comportement attendu :',
    '1. Au chargement de la page, si aucun code valide n\'a été fourni pour cette session, afficher un écran de saisie (overlay plein écran, design cohérent avec la PWA).',
    '2. Quand l\'utilisateur soumet un code, appeler l\'API :',
    '   POST ' + base + '/verify',
    '   Content-Type: application/json',
    '   Body : {"code":"<code saisi>"}',
    '3. Si la réponse est {"valid":true}, masquer l\'écran et laisser la PWA démarrer normalement.',
    '4. Si {"valid":false}, afficher un message d\'erreur "Code invalide" et vider le champ.',
    '5. Si la requête échoue (réseau, HTTP 429), afficher un message clair et ne PAS laisser passer.',
    '6. Ne PAS stocker le code dans localStorage : il doit être redemandé à chaque chargement de page.',
    '7. Le code source ne doit pas être cassé : préserve toutes les fonctionnalités existantes, la structure HTML, les styles et le JS. Insère uniquement l\'overlay et la logique de vérification.',
    '8. L\'overlay doit être en position fixed, z-index élevé, avec un champ mot de passe, un bouton "Déverrouiller", et un état d\'erreur.',
    '',
    'Application cible : ' + app,
    'Worker de vérification : ' + base,
    '',
    'Voici le code source de la PWA à modifier :',
    '',
    '```html',
    '<collez ici le code source de votre PWA>',
    '```'
  ].join('\n');
  try {
    await navigator.clipboard.writeText(prompt);
    toast('Prompt copié — collez-le dans votre IA');
  } catch (e) {
    toast('Copie impossible', true);
  }
}

function renderAppFilters(codes) {
  const el = byId('appFilters');
  if (!el) return;
  const apps = [...new Set((codes || []).map(c => c.app).filter(Boolean))].sort();
  const current = (byId('filterApp').value || '').trim();
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'app-phone' + (current === '' ? ' active' : '');
  allBtn.innerHTML =
    '<div class="phone-frame phone-frame-all"><span class="phone-all-text">Tous</span></div>' +
    '<div class="phone-label">Tous</div>';
  allBtn.onclick = () => {
    byId('filterApp').value = '';
    renderCodes();
  };
  el.appendChild(allBtn);

  apps.forEach(app => {
    let iconUrl = '';
    let short = app;
    try {
      const u = new URL(app);
      const path = u.pathname.replace(/\/+$/, '') || '';
      iconUrl = u.origin + path + '/icon.png';
      const parts = path.split('/').filter(Boolean);
      short = parts.length ? parts[parts.length - 1] : u.hostname.replace(/^www\./, '');
    } catch (e) {}

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'app-phone' + (current === app ? ' active' : '');
    chip.title = app;

    const frame = document.createElement('div');
    frame.className = 'phone-frame';

    const img = document.createElement('img');
    img.src = iconUrl;
    img.alt = short;
    img.loading = 'lazy';
    img.decoding = 'async';

    const fallback = document.createElement('div');
    fallback.className = 'phone-fallback';
    fallback.textContent = (short || '?').charAt(0).toUpperCase();
    fallback.style.display = 'none';

    img.onerror = () => {
      img.style.display = 'none';
      fallback.style.display = 'flex';
    };

    frame.appendChild(img);
    frame.appendChild(fallback);

    const label = document.createElement('div');
    label.className = 'phone-label';
    label.textContent = short.length > 12 ? short.slice(0, 11) + '…' : short;

    chip.appendChild(frame);
    chip.appendChild(label);
    chip.onclick = () => {
      byId('filterApp').value = app;
      renderCodes();
    };
    el.appendChild(chip);
  });
}
function renderCodes() {
  const list = byId('list');
  if (!list) return;

  const filter = (byId('filterApp').value || '').trim();
  let codes = codesCache || [];

  if (filter) {
    codes = codes.filter(c => (c.app || '').includes(filter));
  }

  list.innerHTML = '';

  if (codes.length === 0) {
    list.innerHTML = '<div class="item-meta" style="text-align:center;padding:8px;">Aucun code</div>';
    return;
  }

  codes.forEach(c => {
    const item = document.createElement('div');
    item.className = 'item';
    item.style.cursor = 'pointer';

    const expiresAt = c.expires_at ? new Date(c.expires_at).getTime() : null;
    const isExpiring =
      c.status === 'active' &&
      expiresAt &&
      expiresAt > Date.now() &&
      expiresAt - Date.now() < 30 * 24 * 60 * 60 * 1000;

    const exp = expiresAt
      ? new Date(expiresAt).toLocaleDateString('fr-FR')
      : '∞';

    item.innerHTML =
      '<div class="item-info">' +
        '<div class="item-name' + (isExpiring ? ' expiring' : '') + '">' +
          escapeHtml(c.label || 'Sans nom') +
        '</div>' +
        '<div class="item-meta">Expiration : ' + exp + '</div>' +
      '</div>' +
      '<span class="badge ' + escapeHtml(c.status || '') + '">' +
        escapeHtml(c.status || '—') +
      '</span>' +
      '<button class="del" title="Révoquer le code">✕</button>';

    item.onclick = () => openCodeModal(c);

    const btn = item.querySelector('.del');
    if (btn) {
      btn.onclick = (e) => {
        e.stopPropagation();
        revokeCode(c.id);
      };
    }

    list.appendChild(item);
  });
}
async function loadCodes() {
  if (!adminToken) return;
  const base = workerUrl();
  const url = base + '/admin/codes';
  const list = byId('list');
  list.innerHTML = '<div class="item-meta" style="text-align:center;padding:8px;">Chargement...</div>';
  try {
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + adminToken } });
    log('GET ' + url + ' → ' + resp.status, resp.ok ? 'ok' : 'warn');
    if (resp.status === 401 || resp.status === 403) { disconnect(); return; }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const codes = (data && data.codes) || [];
    codesCache = codes;
    renderAppFilters(codes);
    renderCodes();
  } catch (e) {
    list.innerHTML = '<div class="item-meta" style="text-align:center;padding:8px;color:#f87171;">Erreur de chargement</div>';
    log('Erreur chargement codes : ' + (e.message || e), 'err');
  }
}

async function revokeCode(id) {
  if (!id) return;
  if (!confirm('Révoquer ce code ?')) return;

  const base = workerUrl().replace(/\/+$/, '');

  try {
    const resp = await fetch(
      base + '/admin/codes/' + encodeURIComponent(id) + '/revoke',
      {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + adminToken
        }
      }
    );

    const data = await resp.json().catch(() => ({}));

    log('Révocation → ' + resp.status, resp.ok ? 'ok' : 'warn');

    if (resp.status === 404 && data.error === 'Code introuvable ou déjà révoqué') {
      toast('Ce code est déjà révoqué ou inexistant', true);
      await loadCodes();
      return;
    }

    if (!resp.ok) {
      throw new Error(data.error || 'HTTP ' + resp.status);
    }

    toast('Code révoqué');
    await loadCodes();

  } catch (e) {
    log('Erreur révocation : ' + (e.message || e), 'err');
    toast('Révocation impossible : ' + (e.message || e), true);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function openCodeModal(c) {
  if (!c) return;

  byId('modalTitle').textContent = c.label || 'Sans nom';

  const body = byId('modalBody');
  const created = new Date(c.created_at).toLocaleString('fr-FR');
  const expiresAt = c.expires_at ? new Date(c.expires_at).getTime() : null;
  const exp = expiresAt
    ? new Date(expiresAt).toLocaleString('fr-FR')
    : 'Jamais (∞)';

  let duration = 0;
  if (expiresAt) {
    duration = Math.max(1, Math.ceil((expiresAt - Date.now()) / 86400000));
  }

  const editable = c.status !== 'revoked';

  body.innerHTML =
    '<div class="modal-row"><span class="modal-label">Identifiant</span><span class="modal-value">' + escapeHtml(c.id || '') + '</span></div>' +
    '<div style="margin-top:14px;"><label for="editCodeLabel">Nom</label><input id="editCodeLabel" type="text" maxlength="100" value="' + escapeHtml(c.label || '') + '" ' + (editable ? '' : 'disabled') + ' style="width:100%;margin-top:5px;"></div>' +
    '<div style="margin-top:12px;"><label for="editCodeApp">URL de l’application</label><input id="editCodeApp" type="url" value="' + escapeHtml(c.app || '') + '" ' + (editable ? '' : 'disabled') + ' style="width:100%;margin-top:5px;"></div>' +
    '<div style="margin-top:12px;"><label for="editCodeDuration">Durée en jours (0 = illimitée)</label><input id="editCodeDuration" type="number" min="0" max="3650" value="' + duration + '" ' + (editable ? '' : 'disabled') + ' style="width:100%;margin-top:5px;"></div>' +
    '<div class="modal-row" style="margin-top:14px;"><span class="modal-label">Créé le</span><span class="modal-value">' + created + '</span></div>' +
    '<div class="modal-row"><span class="modal-label">Expire le</span><span class="modal-value">' + exp + '</span></div>' +
    '<div class="modal-row"><span class="modal-label">Statut</span><span class="modal-value"><span class="badge ' + escapeHtml(c.status || '') + '">' + escapeHtml(c.status || '—') + '</span></span></div>';

  const actions = byId('modalActions');
  actions.innerHTML = '';

  if (editable) {
    const saveBtn = document.createElement('button');
    saveBtn.className = 'primary';
    saveBtn.style.flex = '1';
    saveBtn.textContent = 'Enregistrer';
    saveBtn.onclick = () => saveCodeEdits(c.id);
    actions.appendChild(saveBtn);
  }

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'del';
  deleteBtn.style.flex = '1';
  deleteBtn.style.height = '46px';
  deleteBtn.textContent = 'Supprimer définitivement';
  deleteBtn.onclick = () => deleteCode(c.id);
  actions.appendChild(deleteBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'small';
  closeBtn.textContent = 'Fermer';
  closeBtn.onclick = closeCodeModal;
  actions.appendChild(closeBtn);

  byId('codeModal').classList.remove('hidden');
}
async function deleteCode(id) {
  if (!id) return;

  if (!confirm('Supprimer définitivement cet utilisateur et son code d’accès ? Cette action est irréversible.')) {
    return;
  }

  try {
    const base = workerUrl().replace(/\/+$/, '');

    const response = await fetch(
      base + '/admin/codes/' + encodeURIComponent(id),
      {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + adminToken
        }
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Erreur lors de la suppression');
    }

    closeCodeModal();
    toast('Utilisateur supprimé définitivement');
    await loadCodes();

  } catch (error) {
    toast(error.message || 'Impossible de supprimer cet utilisateur', true);
  }
}
async function saveCodeEdits(id) {
  const label = (byId('editCodeLabel').value || '').trim();
  const app = (byId('editCodeApp').value || '').trim();
  const expiresInDays = Number(byId('editCodeDuration').value);

  if (!label) {
    toast('Le nom est obligatoire', true);
    return;
  }

  if (!app) {
    toast('L’URL de l’application est obligatoire', true);
    return;
  }

  if (!Number.isInteger(expiresInDays) || expiresInDays < 0 || expiresInDays > 3650) {
    toast('La durée doit être comprise entre 0 et 3650 jours', true);
    return;
  }

  const base = workerUrl().replace(/\/+$/, '');
  const btn = byId('modalActions').querySelector('.primary');

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Enregistrement…';
  }

  try {
    const response = await fetch(
      base + '/admin/codes/' + encodeURIComponent(id),
      {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify({
          label,
          app,
          expiresInDays
        })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Erreur lors de la modification');
    }

    toast('Modifications enregistrées');
    closeCodeModal();
    await loadCodes();

  } catch (error) {
    toast(error.message || 'Impossible d’enregistrer les modifications', true);

    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Enregistrer';
    }
  }
}
function closeCodeModal() {
  const m = byId('codeModal');
  if (m) m.classList.add('hidden');
}

window.addEventListener('error', (e) => {
  log(
    'Erreur JS : ' +
    (e.message || 'inconnue') +
    ' @ ' +
    (e.filename || '?') +
    ':' +
    (e.lineno || '?'),
    'err'
  );
});
window.addEventListener('unhandledrejection', (e) => {
  log(
    'Promesse rejetée : ' +
    (e.reason && e.reason.message ? e.reason.message : String(e.reason)),
    'err'
  );
});

(function init() {
  log('PWC démarré', 'ok');
  const savedWorker = localStorage.getItem(LS_WORKER);
  if (savedWorker) { byId('workerUrl').value = savedWorker; log('URL Worker restaurée : ' + savedWorker, 'info'); }
  const savedApp = localStorage.getItem(LS_APP);
  if (savedApp) { byId('appUrl').value = savedApp; log('URL app restaurée : ' + savedApp, 'info'); }
  log('Prêt. Saisissez le token admin puis cliquez sur Se connecter.', 'info');
  const modal = byId('codeModal');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeCodeModal();
    });
  }
})();
</script>

if ('serviceWorker' in navigator) {
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(err=>console.error(err));
});
}
